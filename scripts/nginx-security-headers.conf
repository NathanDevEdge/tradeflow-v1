# Security headers — paste these into the `server` block of your nginx config
# (inside the existing `server { ... }` block, at the top level alongside location blocks)

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name tradeflow.devedge.com.au;
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name tradeflow.devedge.com.au;

    ssl_certificate     /etc/letsencrypt/live/tradeflow.devedge.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradeflow.devedge.com.au/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
    # CSP is handled by helmet in Node — don't duplicate here to avoid conflicts.
    # If you want a nginx-level fallback, uncomment the line below:
    # add_header Content-Security-Policy "default-src 'self'; ..." always;

    # ── Hide nginx version ─────────────────────────────────────────────────
    server_tokens off;

    # ── Proxy to Node.js ─────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 55m;
    }
}
